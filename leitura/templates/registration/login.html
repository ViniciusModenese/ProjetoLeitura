{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EstanteAberta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --bg-panel-soft: #21262d;
            --text-main: #e6edf3;
            --text-muted: #bfc8d2;
            --text-subtle: #9aa4af;
            --accent: #58a6ff;
            --accent-light: #79c0ff;
            --danger: #f85149;
            --border-soft: rgba(200, 208, 216, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Sora', sans-serif;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #0b111a 0%, #0f1826 100%);
        }

        .auth-page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("{% static 'img/fundo_login.png' %}");
            background-size: cover;
            background-position: center;
            opacity: 0.36;
            filter: saturate(1.06) contrast(1.03);
            transform: scale(1.03);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 14%, rgba(88, 166, 255, 0.22) 0, rgba(88, 166, 255, 0) 40%),
                radial-gradient(circle at 82% 2%, rgba(88, 166, 255, 0.18) 0, rgba(88, 166, 255, 0) 36%),
                linear-gradient(180deg, rgba(7, 12, 20, 0.46) 0%, rgba(8, 14, 24, 0.75) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .auth-card {
            width: min(460px, 100%);
            background: linear-gradient(180deg, rgba(22, 27, 34, 0.96) 0%, rgba(22, 27, 34, 0.9) 100%);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(3px);
            position: relative;
            isolation: isolate;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 18px;
            padding: 1px;
            background: linear-gradient(130deg, rgba(121, 192, 255, 0.34), rgba(121, 192, 255, 0.04));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }

        .auth-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .auth-kicker {
            color: var(--accent-light);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .auth-title {
            margin: 0;
            color: var(--text-main);
            font-size: 1.7rem;
            font-weight: 800;
        }

        .auth-subtitle {
            color: var(--text-muted);
            margin: 8px 0 0;
            font-size: 0.92rem;
        }

        .form-label {
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.45rem;
        }

        .form-control {
            background: var(--bg-panel-soft);
            border: 1px solid var(--border-soft);
            color: var(--text-main);
            border-radius: 10px;
            padding: 0.72rem 0.82rem;
            font-size: 0.95rem;
        }

        .form-control:focus {
            background: var(--bg-panel-soft);
            color: var(--text-main);
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.2);
        }

        .form-control::placeholder {
            color: var(--text-subtle);
        }

        .btn-auth {
            width: 100%;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #ffffff;
            border-radius: 10px;
            font-weight: 700;
            padding: 0.72rem 0.9rem;
            transition: 0.2s;
        }

        .btn-auth:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
            transform: translateY(-1px);
        }

        .auth-alert {
            border-radius: 10px;
            border: 1px solid rgba(248, 81, 73, 0.4);
            background: rgba(248, 81, 73, 0.15);
            color: #ffd1ce;
            padding: 10px 12px;
            font-size: 0.86rem;
            margin-bottom: 1rem;
        }

        .auth-link {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .auth-footer {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .auth-back {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-subtle);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .auth-back:hover {
            color: var(--accent-light);
        }

        @media (max-width: 575.98px) {
            body::before {
                opacity: 0.28;
            }

            .auth-card {
                padding: 22px 16px;
                border-radius: 14px;
            }

            .auth-title {
                font-size: 1.45rem;
            }
        }
    </style>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="text-center mb-4">
                <img src="{% static 'img/logo.png' %}?v=2" alt="EstanteAberta" class="auth-logo">
                <p class="auth-kicker">Bem-vindo de volta</p>
                <h1 class="auth-title">Entrar na sua conta</h1>
                <p class="auth-subtitle">Continue sua jornada de leitura.</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}

                {% if form.errors %}
                    <div class="auth-alert">Usuário ou senha inválidos. Tente novamente.</div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuário</label>
                    <input type="text" name="username" required id="id_username" class="form-control" autocomplete="username" autofocus>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label">Senha</label>
                    <input type="password" name="password" required id="id_password" class="form-control" autocomplete="current-password">
                </div>

                <button type="submit" class="btn-auth">Entrar</button>
            </form>

            <div class="auth-footer text-center">
                Nao tem uma conta?
                <a href="{% url 'cadastro' %}" class="auth-link">Criar cadastro</a>
                <br>
                <a href="{% url 'home' %}" class="auth-back">Voltar para a home</a>
            </div>
        </section>
    </main>
</body>
</html>
